<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quick Look</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: max(48px, env(safe-area-inset-top)) 24px max(48px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #000807;
        color: #fffff7;
        font: 16px/1.5 system-ui, sans-serif;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .intro {
        margin: 0 0 32px;
        opacity: 0.6;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border: 2px solid rgb(255 255 247 / 0.2);
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s, background-color 0.15s;
      }

      a:hover,
      a:focus-visible {
        border-color: #fffff7;
        background: rgb(255 255 247 / 0.05);
        outline: none;
      }

      .number {
        display: grid;
        place-items: center;
        flex: none;
        width: 44px;
        height: 44px;
        border: 2px solid currentColor;
        border-radius: 50%;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .label {
        flex: 1;
        font-weight: 600;
      }

      .label small {
        display: block;
        font-weight: 400;
        opacity: 0.6;
      }

      .arrow {
        opacity: 0.4;
        transition: transform 0.15s, opacity 0.15s;
      }

      a:hover .arrow,
      a:focus-visible .arrow {
        opacity: 1;
        transform: translateX(3px);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Quick Look</h1>
      <p class="intro">Pick a model to view in 3D or AR.</p>
      <ul>
        <li>
          <a href="./1/">
            <span class="number">1</span>
            <span class="label">Model 1<small>3D and AR</small></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a href="./2/">
            <span class="number">2</span>
            <span class="label">Model 2<small>3D and AR</small></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a href="./3/">
            <span class="number">3</span>
            <span class="label">Model 3<small>3D and AR</small></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
